name: courses
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # assets:
  #   - images/a_dot_burr.jpeg

  fonts:
    - family: Stara
      fonts:
        - asset: assets/fonts/Stara-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Stara-Bold.otf
          weight: 700
        - asset: assets/fonts/Stara-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Stara-Medium.otf
          weight: 500
